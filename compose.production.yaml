# Production overlay. See docs/production.md.
#   docker compose -f compose.yaml -f compose.production.yaml up -d --build --wait
# Differences from compose.yaml: the app and migrations don't use sa, the app isn't
# published directly, and an HTTPS reverse proxy is the only public entry point.
services:
  # Creates the database and the two logins, then exits. The only user of sa besides SQL Server.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    command:
      - bash
      - -c
      - >-
        export SQLCMDPASSWORD="$$(cat /run/secrets/sql_sa_password)"
        MigratorPassword="$$(cat /run/secrets/sql_migrator_password)"
        AppPassword="$$(cat /run/secrets/sql_app_password)";
        exec /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -b -i /init/create-production-logins.sql
    secrets:
      - sql_sa_password
      - sql_migrator_password
      - sql_app_password
    volumes:
      - ./scripts/sql:/init:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  migrate:
    secrets: !override
      - sql_migrator_password
    command: !override
      - bash
      - -c
      - export ConnectionStrings__DataBridge="Server=sqlserver,1433;Database=DataBridge;User Id=databridge_migrator;Password=$$(cat /run/secrets/sql_migrator_password);TrustServerCertificate=True"; exec dotnet DataBridge.dll --apply-migrations
    depends_on:
      db-init:
        condition: service_completed_successfully

  app:
    secrets: !override
      - sql_app_password
    command: !override
      - bash
      - -c
      - export ConnectionStrings__DataBridge="Server=sqlserver,1433;Database=DataBridge;User Id=databridge_app;Password=$$(cat /run/secrets/sql_app_password);TrustServerCertificate=True"; exec dotnet DataBridge.dll
    environment:
      Hangfire__PrepareSchema: "false"
      # Only this address may set X-Forwarded-For and X-Forwarded-Proto.
      ForwardedHeaders__KnownProxies__0: 172.30.57.10
    ports: !reset []

  proxy:
    image: caddy:2-alpine
    environment:
      DATABRIDGE_DOMAIN: ${DATABRIDGE_DOMAIN:-localhost}
    ports:
      - ${DATABRIDGE_PROXY_BIND:-0.0.0.0}:${DATABRIDGE_HTTP_PORT:-80}:80
      - ${DATABRIDGE_PROXY_BIND:-0.0.0.0}:${DATABRIDGE_HTTPS_PORT:-443}:443
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      default:
        ipv4_address: 172.30.57.10
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.57.0/24

volumes:
  caddy-data:

secrets:
  sql_migrator_password:
    file: ${DATABRIDGE_SECRETS_DIR:-./secrets}/sql_migrator_password
  sql_app_password:
    file: ${DATABRIDGE_SECRETS_DIR:-./secrets}/sql_app_password
